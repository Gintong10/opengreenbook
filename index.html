<html lang="en">

    <meta name="description" content="Free, Quizlet-style flashcards, learn mode, practice tests and match games for the quant interview Green Book (A Practical Guide to Quantitative Finance Interviews)." />

        var t = localStorage.getItem('ogb:theme')

      } catch (e) {}
    </script>
